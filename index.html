<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Penduricalho — Pendulum Clicker</title>
    <style>
      /* Boot splash: shown until React mounts and replaces #root's content. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 35%, #141c2b, #05070d 70%); color: #94a3b8;
        font: 600 10px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .24em; text-transform: uppercase; }
      .boot-rig { position: relative; width: 80px; height: 96px; }
      .boot-bar { position: absolute; left: 10px; right: 10px; top: 0; height: 6px; border-radius: 2px; background: #475569; }
      .boot-arm { position: absolute; left: 50%; top: 3px; width: 1px; height: 84px; transform-origin: 50% 0;
        animation: boot-swing 1.6s ease-in-out infinite; background: linear-gradient(#94a3b8, #64748b); }
      .boot-arm::after { content: ""; position: absolute; left: -9px; bottom: -9px; width: 18px; height: 18px; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fdba74, #ea580c); box-shadow: 0 0 22px #f97316; }
      @keyframes boot-swing { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-arm { animation: none; } }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-rig" aria-hidden="true"><div class="boot-bar"></div><div class="boot-arm"></div></div>
        <div>Penduricalho</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
